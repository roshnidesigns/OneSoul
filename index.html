<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUI 2026 – Frame 10</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f5f5f5;
    font-family: system-ui, sans-serif;
  }

  /* Frame 10 — 360 × 800 */
  .frame {
    position: relative;
    width: 360px;
    height: 800px;
    background: #fff;
    overflow: hidden;
  }

  /* background group — 720 × 920 at (-60, -180), clipped by the frame */
  .background {
    position: absolute;
    left: -60px;
    top: -180px;
    width: 720px;
    height: 1040px;
    background: linear-gradient(to bottom, #E6623F 0%, #fff 35%);
  }
  .background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, #2B5D75 0%, rgba(255,255,255,0) 22%);
  }

  .line {
    position: absolute;
    left: 0;
    width: 360px;
    height: 4px;
    background: #000;
    opacity: 0.3;
  }
  .line.top { top: 40px; }
  .line.bottom { top: 760px; }

  .dot {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
  }
  .dot.coral { left: 20px; top: 32px; background: #E6623F; }
  .dot.teal  { left: 272px; top: 740px; background: #2B5D75; }

  /* Rectangle 1 — card */
  .card {
    position: absolute;
    left: 20px;
    top: 120px;
    width: 320px;
    height: 560px;
    border-radius: 24px;
    background: #fff;
    box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.12);
  }

  /* Frame 7313 — pencil / copy buttons */
  .tools {
    position: absolute;
    left: 0;
    top: 312px;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 0 24px 24px 0;
    box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.12);
  }
  .tools button {
    all: unset;
    width: 56px;
    height: 56px;
    padding: 16px;
    cursor: pointer;
  }
  .tools svg { display: block; width: 24px; height: 24px; }

  /* Frame 7315 — dials on the right edge */
  .dial {
    position: absolute;
    left: 318px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #000;
    display: grid;
    place-items: center;
  }
  .dial::before {
    content: "";
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--c);
  }
  .dial.yellow { --c: #ECC833; top: 302px; }
  .dial.blue   { --c: #2B5D75; top: 412px; }
</style>
</head>
<body>
  <main class="frame">
    <div class="background"></div>
    <div class="line top"></div>
    <div class="line bottom"></div>
    <div class="dot coral"></div>
    <div class="dot teal"></div>

    <section class="card" aria-label="Card"></section>

    <div class="tools">
      <button type="button" aria-label="Edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l4 4M21.174 6.812a4.2 4.2 0 0 0-5.986-5.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
        </svg>
      </button>
      <button type="button" aria-label="Copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="8" width="14" height="14" rx="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
      </button>
    </div>

    <div class="dial yellow"></div>
    <div class="dial blue"></div>
  </main>
</body>
</html>
